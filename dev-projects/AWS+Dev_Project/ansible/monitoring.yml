---
- name: Install Node Exporter on Web Server
  hosts: webservers
  become: true

  tasks:

    - name: Install prometheus-node-exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true

    - name: Start Node Exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true