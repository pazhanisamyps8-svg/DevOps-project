---
- name: Disk Usage Monitoring Setup
  hosts: all
  become: yes

  tasks:

    # 1. Create disk monitoring shell script
    - name: Create disk monitoring script
      ansible.builtin.copy:
        dest: /usr/local/bin/disk-monitor.sh
        content: |
          #!/bin/bash
          echo "===== Disk Usage Report: $(date) =====" >> /var/log/disk-monitor.log
          df -h >> /var/log/disk-monitor.log
          echo "" >> /var/log/disk-monitor.log
        owner: root
        group: root
        mode: '0755'

    # 2. Create log file
    - name: Create disk monitoring log file
      ansible.builtin.file:
        path: /var/log/disk-monitor.log
        state: touch
        owner: root
        group: root
        mode: '0644'

    # 3. Schedule cron job at 9 AM every day
    - name: Schedule daily disk monitoring
      ansible.builtin.cron:
        name: "Daily Disk Usage Monitoring"
        minute: "0"
        hour: "9"
        job: "/usr/local/bin/disk-monitor.sh"

    # 4. Ensure cron service is running
    - name: Ensure cron service is running
      ansible.builtin.service:
        name: crond
        state: started
        enabled: yes
