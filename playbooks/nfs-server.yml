---
- name: NFS server automation
  hosts: all
  remote_user: root
  become: yes

  tasks:

    - name: Install NFS server packages
      ansible.builtin.dnf:
        name: nfs-utils
        state: present

    - name: Create a secure directory
      ansible.builtin.file:
        path: /brahmos
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Allow NFS service in firewall
      ansible.posix.firewalld:
        service: nfs
        permanent: yes
        immediate: yes
        state: enabled

    - name: Allow NFS port in firewall
      ansible.posix.firewalld:
        port: 2049/tcp
        permanent: yes
        immediate: yes
        state: enabled

    - name: Configure NFS share
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: '/brahmos 10.237.87.0/24(rw,sync,no_root_squash)'
        state: present

    - name: Reload NFS exports
      ansible.builtin.command:
        cmd: exportfs -ra
      changed_when: true

    - name: Enable and start NFS services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - firewalld
        - nfs-server
